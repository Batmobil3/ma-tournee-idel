name: Bootstrap Ma Tournee IDEL

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore validated source
        shell: bash
        run: |
          printf '%s' '' | base64 --decode > /tmp/ma-tournee-idel-source.tar.gz
          tar -xzf /tmp/ma-tournee-idel-source.tar.gz -C .
      - name: Commit application
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Build Ma Tournee IDEL PWA"
          git push origin HEAD:main
